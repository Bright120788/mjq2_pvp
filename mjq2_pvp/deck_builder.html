<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karess · 卡组编辑器</title>
<style>
/* ============================================================
   黑白（灰阶）配色：白底黑字，不保留任何彩色
   层级用「黑→白」的灰阶 ramp 表达，指令/反制用左侧色条深浅区分
   ============================================================ */
:root {
  color-scheme: light;
  --bg:      #ffffff;   /* 页面底色 */
  --panel:   #fafafa;   /* 面板底色 */
  --panel-2: #f2f2f2;   /* 次级底色（输入框 / 卡组行） */
  --line:    #e2e2e2;   /* 常规描边 */
  --line-2:  #cfcfcf;   /* 加重描边 */
  --ink:     #1a1a1a;   /* 主文字（近黑） */
  --ink-2:   #5f5f5f;   /* 说明文字 */
  --ink-3:   #8f8f8f;   /* 次要信息 */
  --inv:     #ffffff;   /* 反白文字 */
  --g1:      #e8e8e8;   /* 灰阶 ramp 最浅 */
  --g2:      #c9c9c9;
  --g3:      #8a8a8a;
  --g4:      #1a1a1a;   /* 灰阶 ramp 最深 */
  /* 全页仅保留的少量语义色：稀有度标签 + 指令/反制的蓝红（与游戏内一致） */
  --rar-common:  #ededed; --rar-common-ink:  #4a4a4a;
  --rar-limited: #dbe7f5; --rar-limited-ink: #1d4f7c;
  --rar-special: #e7dcf7; --rar-special-ink: #5b3a99;
  --rar-elite:   #f8e7c8; --rar-elite-ink:   #8a5a00;
  --c-order:     #2471a3;   /* 指令（蓝） */
  --c-counter:   #c0392b;   /* 反制（红） */
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  padding: 20px;
}
h1 { color: var(--ink); text-align: center; margin-bottom: 4px; letter-spacing: 1px; }
h1::after { content: ''; display: block; width: 56px; height: 3px; background: var(--g4); margin: 10px auto 0; }
.subtitle { text-align: center; color: var(--ink-3); font-size: 13px; margin-bottom: 20px; }

.layout { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
.card-pool { flex: 1; min-width: 340px; }

.filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.filter-btn {
  padding: 6px 14px;
  border: 1px solid var(--line-2);
  border-radius: 6px;
  background: var(--bg);
  color: var(--ink-2);
  cursor: pointer;
  font-size: 13px;
  font-family: inherit;
}
.filter-btn:hover { border-color: var(--ink); color: var(--ink); }
.filter-btn.active { background: var(--g4); color: var(--inv); border-color: var(--g4); }
/* 类型按钮激活时用对应的语义色，方便一眼区分当前在筛哪一类 */
.filter-btn[data-type="指令"].active { background: var(--c-order); border-color: var(--c-order); }
.filter-btn[data-type="反制"].active { background: var(--c-counter); border-color: var(--c-counter); }

/* ---- 筛选面板（稀有度 / 花费 / 名称 / 描述） ---- */
.filter-panel {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
  padding: 10px 12px; margin-bottom: 12px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
}
.filter-field { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); }
.filter-field > span { white-space: nowrap; }
.filter-field select, .filter-field input {
  font-family: inherit; font-size: 12px; color: var(--ink);
  background: var(--bg); border: 1px solid var(--line-2); border-radius: 6px;
  padding: 4px 8px; height: 28px;
}
.filter-field input { width: 132px; }
.filter-field select:focus, .filter-field input:focus { outline: none; border-color: var(--ink); }
.filter-reset {
  font-family: inherit; font-size: 12px; cursor: pointer;
  background: var(--bg); color: var(--ink-2);
  border: 1px solid var(--line-2); border-radius: 6px; padding: 4px 12px; height: 28px;
}
.filter-reset:hover { border-color: var(--ink); color: var(--ink); }
.filter-count { margin-left: auto; font-size: 12px; color: var(--ink-3); }
.filter-count b { color: var(--ink); }
.card-list .empty-tip { color: var(--ink-3); font-size: 13px; padding: 18px 4px; text-align: center; }

.card-list { display: flex; flex-direction: column; gap: 8px; max-height: 65vh; overflow-y: auto; padding-right: 6px; }
.card-item {
  display: flex; align-items: center; gap: 12px;
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  border-left: 6px solid var(--g2);
  padding: 10px 12px;
}
/* 指令 / 反制：沿用游戏内的蓝 / 红语义色，用左侧色条区分 */
.card-item.指令 { border-left-color: var(--c-order); }
.card-item.反制 { border-left-color: var(--c-counter); }
.card-info { flex: 1; }
.card-name { font-weight: bold; font-size: 15px; }
.cost {
  margin-left: 6px; padding: 1px 6px; border-radius: 4px;
  background: var(--panel-2); color: var(--ink-2); font-size: 11px; font-weight: normal;
}
.card-desc { font-size: 12px; color: var(--ink-2); margin-top: 3px; }
.card-meta { font-size: 11px; color: var(--ink-3); margin-top: 3px; }
/* 稀有度标签：保留彩色（浅底深字，在白底上依然克制） */
.tag-level { display: inline-block; padding: 1px 8px; border-radius: 4px; font-size: 11px; margin-right: 6px; }
.tag-level.普通 { background: var(--rar-common);  color: var(--rar-common-ink); }
.tag-level.限定 { background: var(--rar-limited); color: var(--rar-limited-ink); }
.tag-level.特殊 { background: var(--rar-special); color: var(--rar-special-ink); }
.tag-level.精英 { background: var(--rar-elite);   color: var(--rar-elite-ink); }

.add-btn {
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--g4); color: var(--inv); border: none;
  font-size: 20px; font-weight: bold; cursor: pointer; flex-shrink: 0;
}
.add-btn:hover:not(:disabled) { background: #000; }
.add-btn:disabled { background: var(--g1); color: var(--ink-3); cursor: not-allowed; }

.deck-panel {
  width: 340px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 16px; position: sticky; top: 20px;
}
.deck-panel h2 { font-size: 16px; color: var(--ink); margin-bottom: 10px; }
.deck-count { font-size: 14px; margin-bottom: 10px; color: var(--ink-2); }
.deck-count b { color: var(--ink); }
.deck-list { max-height: 40vh; overflow-y: auto; margin-bottom: 12px; display: flex; flex-direction: column; gap: 4px; }
.deck-row {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font-size: 13px;
}
.deck-row .n { color: var(--ink-3); width: 20px; text-align: right; }
.deck-row .nm { flex: 1; }
.deck-row .x {
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--bg); border: 1px solid var(--line-2); color: var(--ink-2);
  cursor: pointer; font-size: 13px; font-weight: bold;
}
.deck-row .x:hover { background: var(--g4); border-color: var(--g4); color: var(--inv); }

.btn {
  width: 100%; padding: 10px; margin-top: 8px;
  border: 1px solid transparent; border-radius: 8px; font-size: 14px; font-weight: bold;
  cursor: pointer; font-family: inherit;
}
.btn-export { background: var(--g4); color: var(--inv); }                              /* 主操作：黑底白字 */
.btn-export:hover { background: #000; }
.btn-import { background: var(--g3); color: var(--inv); }                              /* 次操作：中灰 */
.btn-import:hover { background: var(--g4); }
.btn-clear { background: var(--bg); border-color: var(--line-2); color: var(--ink-2); } /* 描边按钮 */
.btn-clear:hover { border-color: var(--ink); color: var(--ink); }
.btn-copy { background: var(--panel-2); color: var(--ink); }                            /* 浅灰按钮 */
.btn-copy:hover { background: var(--g2); }
textarea.code {
  width: 100%; height: 52px; margin-top: 8px; padding: 8px;
  border-radius: 6px; border: 1px solid var(--line); background: var(--panel-2); color: var(--ink);
  font-family: monospace; font-size: 12px; resize: none;
}
textarea.code:focus { outline: none; border-color: var(--ink); background: var(--bg); }
textarea.code::placeholder { color: var(--ink-3); }
/* 没有颜色可用了，状态改用「符号 + 灰底」区分：错误=粗体黑字带 ✕，成功=灰字带 ✓ */
.err { color: var(--ink); font-size: 12px; min-height: 16px; margin-top: 6px; }
.err:not(:empty) { font-weight: bold; background: var(--panel-2); border-radius: 4px; padding: 2px 6px; }
.err:not(:empty)::before { content: '✕ '; }
.ok { color: var(--ink-2); font-size: 12px; min-height: 16px; margin-top: 6px; }
.ok:not(:empty)::before { content: '✓ '; }

/* 滚动条也走灰阶，避免系统默认的彩色/深色轨道破坏黑白感 */
.card-list::-webkit-scrollbar, .deck-list::-webkit-scrollbar { width: 8px; }
.card-list::-webkit-scrollbar-track, .deck-list::-webkit-scrollbar-track { background: var(--panel-2); border-radius: 4px; }
.card-list::-webkit-scrollbar-thumb, .deck-list::-webkit-scrollbar-thumb { background: var(--g2); border-radius: 4px; }
.card-list::-webkit-scrollbar-thumb:hover, .deck-list::-webkit-scrollbar-thumb:hover { background: var(--g3); }
/* 键盘焦点环也换成黑色，盖掉浏览器默认的蓝色描边 */
button:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--g4); outline-offset: 2px; }
/* ===== 统一深色卡组编辑器主题 ===== */
:root { color-scheme: dark; --bg:#0b1117; --panel:#151d25; --panel-2:#1d2832; --line:#33424e; --line-2:#526270; --ink:#e6edf3; --ink-2:#a9b7c3; --ink-3:#7f909f; --inv:#10151a; --g1:#26333d; --g2:#3d4d59; --g3:#78909e; --g4:#d4aa5e; --c-order:#62c4c5; --c-counter:#e39a64; }
body { background: linear-gradient(135deg, rgba(5,8,12,.86), rgba(10,13,18,.45)), url('/Background.jpg') center / cover fixed no-repeat; color: var(--ink); }
h1 { color: #f0cc82; text-shadow: 0 2px 14px rgba(237,190,99,.2); }
.filter-btn { background: rgba(255,255,255,.04); color: var(--ink-2); border-color: var(--line-2); }
.filter-btn:hover { border-color: #d4aa5e; color: var(--ink); }
.filter-btn.active { background: #c1934a; color: #17130d; border-color: #e1bb70; }
.filter-btn[data-type="指令"].active { background: var(--c-order); border-color: var(--c-order); color: #102126; }
.filter-btn[data-type="反制"].active { background: var(--c-counter); border-color: var(--c-counter); color: #241710; }
.filter-panel, .deck-panel { background: rgba(20,29,37,.92); border-color: var(--line); }
.filter-field select, .filter-field input { background: #0b1117; color: var(--ink); border-color: var(--line-2); }
.card-item { background: linear-gradient(145deg,#202b35,#11181f); border-color: #3e4d59; color: var(--ink); box-shadow: 0 6px 18px rgba(0,0,0,.28); }
.card-item:hover { border-color: #d4aa5e; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
.card-item.指令 { border-left-color: var(--c-order); }
.card-item.反制 { border-left-color: var(--c-counter); }
.deck-list, .deck-summary { background: rgba(11,17,23,.9); border-color: var(--line); }
.deck-card { background: #202b35; border-color: #526270; color: var(--ink); }
.card-desc { color: var(--ink-2); }
.card-meta { color: var(--ink-3); }
button { color: var(--ink); }
button.primary, .btn-primary { background: #bd8f46; color: #17130d; border-color: #e1bb70; }
</style>
</head>
<body>

<h1>马嘉棋2 · 卡组编辑器</h1>
<div class="subtitle">单机本地页面，无需服务器。卡组最多 50 张；同名卡限张：普通4 / 限定3 / 特殊2 / 精英1</div>

<div class="layout">
  <div class="card-pool">
    <div class="filter-bar">
      <button class="filter-btn active" data-type="all">全部</button>
      <button class="filter-btn" data-type="指令">指令</button>
      <button class="filter-btn" data-type="反制">反制</button>
    </div>
    <div class="filter-panel">
      <label class="filter-field"><span>稀有度</span>
        <select id="fLevel">
          <option value="all">全部</option>
          <option value="普通">普通</option>
          <option value="限定">限定</option>
          <option value="特殊">特殊</option>
          <option value="精英">精英</option>
        </select>
      </label>
      <label class="filter-field"><span>花费</span>
        <select id="fCost">
          <option value="all">全部</option>
          <option value="0-2">0 ~ 2K</option>
          <option value="3-5">3 ~ 5K</option>
          <option value="6-9">6 ~ 9K</option>
          <option value="10-14">10 ~ 14K</option>
          <option value="15+">15K 及以上</option>
        </select>
      </label>
      <label class="filter-field"><span>名称</span><input type="text" id="fName" placeholder="名称关键词"></label>
      <label class="filter-field"><span>描述</span><input type="text" id="fDesc" placeholder="描述关键词"></label>
      <button class="filter-reset" id="fReset" type="button">清空筛选</button>
      <div class="filter-count" id="fCount"></div>
    </div>
    <div class="card-list" id="cardList"></div>
  </div>

  <div class="deck-panel">
    <h2>我的卡组</h2>
    <div class="deck-count">已选 <b id="count">0</b> / 50 张</div>
    <div class="deck-list" id="deckList"></div>
    <button class="btn btn-export" onclick="exportCode()">导出卡组码</button>
    <button class="btn btn-import" onclick="importPrompt()">导入卡组码</button>
    <button class="btn btn-clear" onclick="clearDeck()">清空卡组</button>
    <textarea class="code" id="codeOut" readonly placeholder="导出的卡组码会显示在这里"></textarea>
    <textarea class="code" id="codeIn" placeholder="粘贴卡组码后点击导入"></textarea>
    <div class="err" id="err"></div>
    <div class="ok" id="ok"></div>
    <button class="btn btn-copy" onclick="copyCode()" style="margin-top:4px">复制卡组码</button>
  </div>
</div>

<script>
// ============================================================
// 卡牌数据（与游戏端 ma_jia_qi_2.html 保持一致）
// 字段：id / name / cost / type / level / desc
// ============================================================
const CARDS = {
  granary:  { id:'granary',   name:'广积粮',   cost:3, type:'指令', level:'普通', needTarget:false, desc:'指挥点槽+1（上限40）' },
  suppress: { id:'suppress',  name:'压制',     cost:2, type:'指令', level:'普通', needTarget:true,  desc:'压制一个格子；若其已被压制，则将其兵力设为1' },
  levee:    { id:'levee',     name:'临时征召', cost:2, type:'指令', level:'限定', needTarget:true,  desc:'目标格+30兵力，下下个友方回合结束-30（不会因此低于1）；移动：词条随兵力移动，占领时跟随，格失守则消失' },
  defeat:   { id:'defeat',    name:'溃敌',     cost:3, type:'指令', level:'普通', needTarget:true,  desc:'将兵力≤20的非大本营格子兵力降为1' },
  chaos:    { id:'chaos',     name:'混乱',     cost:3, type:'指令', level:'普通', needTarget:true,  desc:'将与友方格相邻、兵力≤20的非友方格转为友方格' },
  carpet:   { id:'carpet',    name:'地毯式轰炸', cost:9, type:'指令', level:'特殊', needTarget:false, desc:'敌方所有非总部格受15伤害（兵力不低于1）' },
  rally:    { id:'rally',     name:'重整旗鼓', cost:4, type:'指令', level:'限定', needTarget:true,  desc:'移除所有友方格子的压制，目标友方格+5兵力' },
  zone_suppress: { id:'zone_suppress', name:'区域压制', cost:4, type:'指令', level:'精英', needTarget:true, desc:'目标格3x3范围全部压制' },
  air_sup:  { id:'air_sup',   name:'空中优势', cost:4, type:'指令', level:'精英', needTarget:true,  desc:'压制一整行或一列（点击行号/列号）' },
  conquer:  { id:'conquer',   name:'征服',     cost:2, type:'指令', level:'普通', needTarget:false, desc:'友方每占领10格，抽1张牌' },
  warbond:  { id:'warbond',   name:'战争债券', cost:5, type:'指令', level:'限定', needTarget:false, desc:'获得1个指挥点槽；友方大本营"下个友方回合结束+1槽"' },
  supply:   { id:'supply',    name:'物资运输', cost:1, type:'指令', level:'普通', needTarget:false, desc:'将一个「生产」和「计划」加入手牌' },
  production:{ id:'production', name:'生产',    cost:0, type:'指令', level:'普通', needTarget:false, desc:'获得1个指挥点（不可主动携带)' },
  retreat:  { id:'retreat',   name:'撤退',     cost:3, type:'指令', level:'普通', needTarget:true,  desc:'撤退友方格或兵力≤35非敌方大本营敌方格：降至1，其余随机分给相邻友方格' },
  rebellion:{ id:'rebellion', name:'叛乱',     cost:5, type:'指令', level:'限定', needTarget:true,  desc:'将非大本营敌方格转为友方；只能攻击不能转移，友方回合结束变回敌方' },
  scatter:  { id:'scatter',   name:'随机弹道', cost:0, type:'指令', level:'普通', needTarget:true,  desc:'对非大本营格子造成随机0/6/12伤害' },
  mobilize: { id:'mobilize',  name:'动员',     cost:9, type:'指令', level:'限定', needTarget:false, desc:'仅限本回合移动/攻击前；若友方总兵力≤敌方，所有友方格+10兵力；+5指挥点' },
  fastlink: { id:'fastlink',  name:'快速联络', cost:7, type:'指令', level:'特殊', needTarget:true,  desc:'连接目标格与友方大本营：目标格须与某个己方格曼哈顿距离≤13；随机最短路上的每个格子临时连为友方（存续到下个友方回合结束时）；届时原中立格变回中立、原敌方格设回兵力5的敌方——但若该格期间已被本方移动兵力真正占领，则不再回退' },
  blitz:    { id:'blitz',     name:'闪电战',   cost:5, type:'指令', level:'特殊', needTarget:false, desc:'本回合所有移动与攻击实时结算' },
  winter:   { id:'winter',    name:'冬季攻势', cost:4, type:'指令', level:'特殊', needTarget:false, desc:'全场非中立格受6伤害（不低于1兵力）' },
  united:   { id:'united',    name:'联合进攻', cost:12, type:'指令', level:'精英', needTarget:true,  desc:'对一个敌方大本营造成80伤害' },
  quick_dispatch:{ id:'quick_dispatch', name:'快速调度', cost:4, type:'指令', level:'特殊', needTarget:false, desc:'本回合友方格子移动时-1花费' },
  local_resist:{ id:'local_resist', name:'局部抵抗', cost:2, type:'指令', level:'普通', needTarget:true, desc:'压制一个敌方格，对敌方大本营造成10伤害，洗一张「抵抗」入敌方卡组' },
  resist:  { id:'resist',    name:'抵抗',     cost:1, type:'指令', level:'普通', needTarget:false, desc:'抉择：对友方大本营造成10伤害，或弃掉卡组顶一张牌（不可主动携带)' },
  border_patrol:{ id:'border_patrol', name:'边境巡查', cost:3, type:'指令', level:'特殊', needTarget:true, desc:'抉择：控制一个不与非敌方格相邻且兵力≤30的格子，或压制所有与友方格相邻的敌方格' },
  rest:     { id:'rest',      name:'休养',     cost:7, type:'指令', level:'特殊', needTarget:false, desc:'双方抽牌，直到手牌数量为9' },
  peace_summit:{ id:'peace_summit', name:'求和', cost:6, type:'指令', level:'普通', needTarget:false, desc:'抉择：抽1张+友方大本营+20兵力，或双方抽3张+双方大本营各+40兵力' },

// 等级限张
const LEVEL_LIMIT = { '普通': 4, '限定': 3, '特殊': 2, '精英': 1 };
const MAX_DECK = 50; // 卡组上限（2026-09-29 由 45 提升为 50）

let deck = []; // [cardId]

// 卡组码编码：D1 + base64(JSON)
function encodeDeck() {
  return 'D1' + btoa(unescape(encodeURIComponent(JSON.stringify(deck))));
}
function decodeDeck(code) {
  if (typeof code !== 'string' || code.length < 3 || code.substring(0, 2) !== 'D1') {
    return { ok: false, err: '卡组码格式不正确（应以 D1 开头）' };
  }
  let arr;
  try {
    arr = JSON.parse(decodeURIComponent(escape(atob(code.substring(2)))));
  } catch (e) {
    return { ok: false, err: '卡组码解析失败' };
  }
  if (!Array.isArray(arr)) return { ok: false, err: '卡组码无效' };
  const vErr = validateDeck(arr);
  if (vErr) return { ok: false, err: vErr };
  return { ok: true, deck: arr };
}
function validateDeck(arr) {
  if (arr.length > MAX_DECK) return '卡组数量超过 ' + MAX_DECK + ' 张';
  if (arr.length === 0) return '卡组为空';
  const count = {};
  for (const id of arr) {
    const c = CARDS[id];
    if (!c) return '包含未知卡牌: ' + id;
    if (HIDDEN_IN_BUILDER.includes(id)) return '「' + (c ? c.name : id) + '」无法被主动携带';
    count[id] = (count[id] || 0) + 1;
    if (count[id] > LEVEL_LIMIT[c.level]) {
      return '卡牌「' + c.name + '」为' + c.level + '级，最多 ' + LEVEL_LIMIT[c.level] + ' 张';
    }
  }
  return null;
}

function canAdd(id) {
  const c = CARDS[id];
  if (!c) return false;
  if (HIDDEN_IN_BUILDER.includes(id)) return false; // 无法主动携带
  if (deck.length >= MAX_DECK) return false;
  const n = deck.filter(x => x === id).length;
  return n < LEVEL_LIMIT[c.level];
}

function addCard(id) {
  if (!canAdd(id)) { setErr('无法添加：超出限张或上限'); return; }
  deck.push(id);
  renderAll();
}
function removeCard(idx) {
  deck.splice(idx, 1);
  renderAll();
}

function clearDeck() { deck = []; renderAll(); }

function exportCode() {
  const vErr = validateDeck(deck);
  if (vErr) { setErr(vErr); document.getElementById('ok').textContent = ''; return; }
  document.getElementById('codeOut').value = encodeDeck();
  setOk('已生成卡组码（' + deck.length + ' 张）');
}
function importPrompt() {
  const code = document.getElementById('codeIn').value.trim();
  if (!code) { setErr('请先粘贴卡组码'); return; }
  const r = decodeDeck(code);
  if (!r.ok) { setErr(r.err); document.getElementById('ok').textContent = ''; return; }
  deck = r.deck.slice();
  renderAll();
  setOk('导入成功：' + deck.length + ' 张');
}
function copyCode() {
  const ta = document.getElementById('codeOut');
  if (!ta.value) { setErr('请先导出卡组码'); return; }
  ta.select();
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(ta.value).then(() => setOk('已复制到剪贴板'));
  } else {
    document.execCommand('copy');
    setOk('已复制到剪贴板');
  }
}
function setErr(m) { document.getElementById('err').textContent = m; }
function setOk(m) { document.getElementById('ok').textContent = m; }

// 不可被主动携带的卡（牌库中隐藏；仅由其他卡牌给予）
const HIDDEN_IN_BUILDER = ['plan', 'production', 'resist', 'seize7', 'seize5', 'seize3', 'seize1', 'seize0', 'mil_research', 'ext_research', 'adv_research', 'pol_research', 'med_research', 'def_research', 'ext_def_research', 'adv_def_research', 'nuke', 'night_raid', 'boost_prod', 'force_amp', 'weapon2', 'air_assist', 'single_strike', 'pol_propaganda', 'ext_pol_research', 'pol_morale', 'adv_pol_research', 'military_center', 'satbarrage', 'immunity', 'ext_med_research', 'bio_warfare', 'adv_med_research', 'penicillin', 'nuke_strike', 'warning', 'def_component', 'active_sonar', 'suppress_retreat', 'log_research', 'ext_log_research', 'adv_log_research', 'flying_bomb', 'synth_oil', 'silent_raid', 'nuke_world', 'blast', 'sustained_raid_reinforce'];

// 渲染
function renderAll() { renderCardList(); renderDeck(); }
// ---- 筛选条件（类型 / 稀有度 / 花费 / 名称 / 描述，互相叠加）----
function costInRange(cost, range) {
  if (range === 'all') return true;
  if (range === '15+') return cost >= 15;
  const parts = range.split('-');
  return cost >= Number(parts[0]) && cost <= Number(parts[1]);
}
function matchFilters(c) {
  if (currentFilter !== 'all' && c.type !== currentFilter) return false;
  if (filterLevel !== 'all' && c.level !== filterLevel) return false;
  if (!costInRange(c.cost, filterCost)) return false;
  if (filterName && c.name.toLowerCase().indexOf(filterName) === -1) return false;
  if (filterDesc && (c.desc || '').toLowerCase().indexOf(filterDesc) === -1) return false;
  return true;
}
function renderCardList() {
  const list = document.getElementById('cardList');
  list.innerHTML = '';
  let shown = 0;
  for (const id of Object.keys(CARDS)) {
    if (HIDDEN_IN_BUILDER.includes(id)) continue; // 隐藏不可携带卡
    const c = CARDS[id];
    if (!matchFilters(c)) continue;
    shown++;
    const item = document.createElement('div');
    item.className = 'card-item ' + c.type;
    item.innerHTML = '<div class="card-info">' +
      '<div class="card-name">' + c.name + '<span class="cost">' + c.cost + ' K</span></div>' +
      '<div class="card-meta"><span class="tag-level ' + c.level + '">' + c.level + '</span>' + c.type + '</div>' +
      '<div class="card-desc">' + c.desc + '</div></div>';
    const btn = document.createElement('button');
    btn.className = 'add-btn';
    btn.textContent = '+';
    btn.disabled = !canAdd(id);
    btn.onclick = () => addCard(id);
    item.appendChild(btn);
    list.appendChild(item);
  }
  if (!shown) {
    const tip = document.createElement('div');
    tip.className = 'empty-tip';
    tip.textContent = '没有符合筛选条件的卡牌';
    list.appendChild(tip);
  }
  const cnt = document.getElementById('fCount');
  if (cnt) cnt.innerHTML = '筛出 <b>' + shown + '</b> / ' + Object.keys(CARDS).filter(id => !HIDDEN_IN_BUILDER.includes(id)).length + ' 张';
}
function renderDeck() {
  document.getElementById('count').textContent = deck.length;
  const list = document.getElementById('deckList');
  list.innerHTML = '';
  deck.forEach((id, i) => {
    const c = CARDS[id];
    if (!c) return;
    const row = document.createElement('div');
    row.className = 'deck-row';
    row.innerHTML = '<span class="n">' + (i + 1) + '</span>' +
      '<span class="nm">' + c.name + ' <span class="cost">' + c.cost + 'K</span></span>';
    const x = document.createElement('button');
    x.className = 'x';
    x.textContent = '×';
    x.onclick = () => removeCard(i);
    row.appendChild(x);
    list.appendChild(row);
  });
}

let currentFilter = 'all';   // 类型：all / 指令 / 反制
let filterLevel = 'all';     // 稀有度：all / 普通 / 限定 / 特殊 / 精英
let filterCost = 'all';      // 花费区间：all / 0-2 / 3-5 / 6-9 / 10-14 / 15+
let filterName = '';         // 名称关键词（小写）
let filterDesc = '';         // 描述关键词（小写）

document.querySelectorAll('.filter-btn').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    currentFilter = b.dataset.type;
    renderCardList();
  });
});
document.getElementById('fLevel').addEventListener('change', (e) => { filterLevel = e.target.value; renderCardList(); });
document.getElementById('fCost').addEventListener('change', (e) => { filterCost = e.target.value; renderCardList(); });
document.getElementById('fName').addEventListener('input', (e) => { filterName = e.target.value.trim().toLowerCase(); renderCardList(); });
document.getElementById('fDesc').addEventListener('input', (e) => { filterDesc = e.target.value.trim().toLowerCase(); renderCardList(); });
document.getElementById('fReset').addEventListener('click', () => {
  document.getElementById('fLevel').value = 'all';
  document.getElementById('fCost').value = 'all';
  document.getElementById('fName').value = '';
  document.getElementById('fDesc').value = '';
  filterLevel = 'all'; filterCost = 'all'; filterName = ''; filterDesc = '';
  document.querySelectorAll('.filter-btn').forEach(x => x.classList.remove('active'));
  document.querySelector('.filter-btn[data-type="all"]').classList.add('active');
  currentFilter = 'all';
  renderCardList();
});

renderAll();
</script>
